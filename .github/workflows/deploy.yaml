name: Deploy

on:
    workflow_dispatch:
        inputs:
            branch_hash:
                description: Branch hash (default) or revision to deploy
                default: main
            environments:
                description: The environment to deploy to
                type: choice
                default: testing
                options:
                    - testing
                    - production

jobs:
    deploy:
        permissions:
            contents: read
            packages: write
        name: Deploy to ${{inputs.environments}}
        uses: hathitrust/github_actions/.github/workflows/deploy.yml@dc1e0d1e000e898af7ac65b5ecb1e3f7d9fd1dcc # v2.1.0
        with:
            image: ghcr.io/${{ github.repository }}:${{ inputs.branch_hash || github.sha}}
            file: environments/metadata_processing/${{inputs.environments}}/post-zephir-image.txt
            CONFIG_REPO_FULL_NAME: ${{ vars.CONFIG_REPO_FULL_NAME }}
            CONFIG_REPO_RW_APP_ID: ${{ vars.CONFIG_REPO_RW_APP_ID }}
        secrets: inherit
